name: QA Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: Pruebas API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Ejecutar pruebas de API
        run: npx playwright test --project=api
      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: allure-results
          retention-days: 14
      - name: Subir resultados JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: json-results-api
          path: results

  e2e-tests:
    name: Pruebas E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Ejecutar pruebas E2E
        run: npx playwright test --project=e2e-chromium
      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-e2e
          path: allure-results
          retention-days: 14
      - name: Subir resultados JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: json-results-e2e
          path: results
      - name: Subir trazas, videos y capturas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidencia
          path: test-results
          retention-days: 7

  report:
    name: Reporte Allure
    runs-on: ubuntu-latest
    needs: [api-tests, e2e-tests]
    if: always()
    outputs:
      report_ready: ${{ steps.gen.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
      - id: gen
        name: Generar reporte Allure
        run: npx allure generate allure-results --clean -o allure-report
      - uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 30
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: allure-report

  publish-report:
    name: Publicar reporte (GitHub Pages)
    runs-on: ubuntu-latest
    needs: report
    if: always() && github.ref == 'refs/heads/main' && needs.report.result == 'success'
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  notify:
    name: Notificar resultados
    runs-on: ubuntu-latest
    needs: [api-tests, e2e-tests, report]
    if: always()
    steps:
      - name: Resumen en la corrida y notificación
        env:
          API_RESULT: ${{ needs.api-tests.result }}
          E2E_RESULT: ${{ needs.e2e-tests.result }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$API_RESULT" = "success" ] && [ "$E2E_RESULT" = "success" ]; then
            STATUS="✅ PASSED"
          else
            STATUS="❌ FAILED"
          fi
          {
            echo "## Resultado del pipeline: $STATUS"
            echo ""
            echo "| Suite | Resultado |"
            echo "|---|---|"
            echo "| API | $API_RESULT |"
            echo "| E2E | $E2E_RESULT |"
            echo ""
            echo "Rama: \`$REF\` · Autor: $ACTOR · [Ver corrida]($RUN_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sS -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"$STATUS - QA Pipeline ($REF, por $ACTOR)\nAPI: $API_RESULT | E2E: $E2E_RESULT\n$RUN_URL\"}" \
              "$SLACK_WEBHOOK_URL"
          else
            echo "SLACK_WEBHOOK_URL no configurado: solo se publicó el resumen."
          fi
          [ "$STATUS" = "✅ PASSED" ]
